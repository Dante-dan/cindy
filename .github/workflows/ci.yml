name: RPM packaging QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rpm:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            rpm_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            rpm_arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      XDT_SKIP_AGENT_BIN_INSTALL: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
      - name: Verify migration freeze history is available
        run: git rev-parse --verify '51440f675cbc8a42c582614dda6b3c34e65c298d^{commit}'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg desktop-file-utils rpm xvfb dbus-x11 libsecret-1-dev libx11-dev libxkbfile-dev libgtk-3-dev libnss3 libasound2t64 libgbm1 libxtst6 libarchive-tools libjson-c-dev
      - run: pnpm install --frozen-lockfile
      - name: Build both formats and run repository packaged smoke
        run: xvfb-run -a pnpm --filter desktop release:package --platform linux --arch ${{ matrix.arch }} --region global
      - name: Validate native RPM identity
        run: |
          rpm_file=apps/desktop/release/artifacts/global/unversioned/linux-${{ matrix.arch }}/cindy-unversioned-${{ matrix.rpm_arch }}.rpm
          test "$(rpm -qp --queryformat '%{ARCH}' "$rpm_file")" = '${{ matrix.rpm_arch }}'
          test "$(rpm -qp --queryformat '%{NAME}' "$rpm_file")" = cindy
          rpm -qpl "$rpm_file"
          rpm -qpR "$rpm_file"
          rpm -qp --scripts "$rpm_file"
      - name: Install, smoke, reinstall and uninstall on Fedora
        run: |
          docker run --rm -v "$PWD:/source:ro" fedora:43 bash -euc '
            dnf install -y /source/apps/desktop/release/artifacts/global/unversioned/linux-${{ matrix.arch }}/*.rpm nodejs xorg-x11-server-Xvfb xorg-x11-xauth dbus-x11 desktop-file-utils
            rpm -V cindy
            desktop-file-validate /usr/share/applications/cindy.desktop
            grep -F "x-scheme-handler/cindy" /usr/share/applications/cindy.desktop
            grep -F "x-scheme-handler/xdt-maker" /usr/share/applications/cindy.desktop
            useradd -m rpmqa
            runuser -u rpmqa -- dbus-run-session -- xvfb-run -a node /source/apps/desktop/scripts/smoke-packaged.mjs --platform=linux --arch=${{ matrix.arch }} --out-dir=/usr/lib/cindy
            dnf reinstall -y /source/apps/desktop/release/artifacts/global/unversioned/linux-${{ matrix.arch }}/*.rpm
            dnf remove -y cindy
            test ! -e /usr/lib/cindy/Cindy
            test ! -e /usr/share/applications/cindy.desktop
          '
