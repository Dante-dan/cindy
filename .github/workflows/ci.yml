name: Personal DEB-only packaging QA
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  personal-deb:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: x64
            rpm_arch: x86_64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    env:
      XDT_SKIP_AGENT_BIN_INSTALL: '1'
      NODE_OPTIONS: '--max-old-space-size=8192'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          lfs: true
      - name: Verify migration freeze history is available
        run: git rev-parse --verify '51440f675cbc8a42c582614dda6b3c34e65c298d^{commit}'
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86
        with:
          run_install: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
      - name: Install Linux build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot dpkg desktop-file-utils xvfb dbus-x11 libsecret-1-dev libx11-dev libxkbfile-dev libgtk-3-dev libnss3 libasound2t64 libgbm1 libxtst6 libarchive-tools libjson-c-dev libturbojpeg0-dev libpng-dev libwayland-dev libwayland-bin libxkbcommon-dev build-essential pkg-config
      - run: pnpm install --frozen-lockfile
      - name: Assert no RPM build tool and test personal-build command selection
        run: |
          ! command -v rpmbuild
          pnpm --filter desktop exec vitest run src/main/cindy-make/__tests__/personalBuild.test.ts --maxWorkers=1
      - name: Build personal DEB-only artifact with repository packaged smoke
        run: xvfb-run -a pnpm --filter desktop release:package --platform linux --arch ${{ matrix.arch }} --region global --no-sign --linux-deb-only
      - name: Validate only DEB installer metadata
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            import assert from "node:assert/strict";
            const dir = "apps/desktop/release/artifacts/global/unversioned/linux-${{ matrix.arch }}";
            const info = JSON.parse(fs.readFileSync(`${dir}/build-info.json`));
            assert.deepEqual(info.files.map(f => f.role), ["installer"]);
            assert.ok(info.files[0].name.endsWith(".deb"));
            assert.ok(fs.readdirSync(dir).every(f => !f.endsWith(".rpm")));
          '
